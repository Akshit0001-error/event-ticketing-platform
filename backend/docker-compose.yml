
services:
  # PostgreSQL database
  db:
    image: postgres:15
    ports:
      - "5433:5432"
    restart: always
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata

  # Database management UI — http://localhost:8888
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 8888:8080
    environment:
      TZ: Asia/Kolkata
